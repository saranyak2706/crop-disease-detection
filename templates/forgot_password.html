
<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            width: 350px;
            border-radius: 10px;
            box-shadow: 0 2px 10px #ccc;
        }

        h2 {
            text-align: center;
            color: #2e7d32;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 15px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Forgot Password</h2>

        <p>Enter your registered email address.</p>

        <form method="POST">
            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <button type="submit">Send Reset Link</button>
        </form>

        <p>
            <a href="{{ url_for('auth.login') }}">Back to Login</a>
        </p>
    </div>
</body>
</html>
