
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Soil Reading</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7f4;
            padding: 25px;
            color: #333;
        }

        .container {
            max-width: 550px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }

        h2 {
            color: #216b3a;
            margin-bottom: 10px;
        }

        .location {
            color: #666;
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        button, .back-link {
            display: inline-block;
            padding: 12px 18px;
            margin-top: 22px;
            background: #218838;
            color: white;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
            font-size: 14px;
        }

        .back-link {
            background: #666;
            margin-left: 8px;
        }

        button:hover {
            background: #176b2b;
        }

        .note {
            margin-top: 15px;
            color: #777;
            font-size: 13px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Add Soil Reading</h2>

    <p class="location">
        Farm Location: <strong>{{ field.location }}</strong>
    </p>

    <form
        action="{{ url_for('soil.add_soil_reading', field_id=field.id) }}"
        method="POST"
    >

        <label for="moisture">Soil Moisture (%)</label>
        <input
            type="number"
            id="moisture"
            name="moisture"
            min="0"
            max="100"
            step="0.1"
            required
        >

        <label for="ph">Soil pH</label>
        <input
            type="number"
            id="ph"
            name="ph"
            min="0"
            max="14"
            step="0.1"
            required
        >

        <label for="nitrogen">Nitrogen (N)</label>
        <input
            type="number"
            id="nitrogen"
            name="nitrogen"
            min="0"
            step="0.1"
            required
        >

        <label for="phosphorus">Phosphorus (P)</label>
        <input
            type="number"
            id="phosphorus"
            name="phosphorus"
            min="0"
            step="0.1"
            required
        >

        <label for="potassium">Potassium (K)</label>
        <input
            type="number"
            id="potassium"
            name="potassium"
            min="0"
            step="0.1"
            required
        >

        <button type="submit">Save Soil Reading</button>

        <a href="{{ url_for('dashboard') }}" class="back-link">
            Back to Dashboard
        </a>

    </form>

    <p class="note">
        Enter values from your soil test report or verified soil measurements.
    </p>

</div>

</body>
</html>
